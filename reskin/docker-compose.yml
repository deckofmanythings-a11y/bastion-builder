# Bastion map reskins on the Foundry laptop.
#   comfyui - image generation (GPU), only bound to 127.0.0.1
#   worker  - polls the bb-reskin-worker edge function for jobs, runs them through ComfyUI, uploads results.
# Nothing here listens on the internet; the worker only makes outbound HTTPS calls to Supabase.
services:
  comfyui:
    build: ./comfyui
    container_name: bastion-comfyui
    restart: unless-stopped
    mem_limit: 9g          # never starve Foundry; the worker also unloads models after 10 idle minutes
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./models/checkpoints:/opt/ComfyUI/models/checkpoints
      - ./models/controlnet:/opt/ComfyUI/models/controlnet
      - ./io/input:/opt/ComfyUI/input
      - ./io/output:/opt/ComfyUI/output
    ports:
      - "127.0.0.1:8188:8188"
  worker:
    build: ./worker
    container_name: bastion-reskin-worker
    restart: unless-stopped
    env_file: .env
    environment:
      COMFY_URL: http://comfyui:8188
    depends_on:
      - comfyui
